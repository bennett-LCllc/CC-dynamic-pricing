version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cc-ops-db
    environment:
      POSTGRES_USER: ccops
      POSTGRES_PASSWORD: ccops_dev_password
      POSTGRES_DB: corpus_christi_ops
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ccops']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cc-ops-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
