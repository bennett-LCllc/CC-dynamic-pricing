global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'cc-ops-local'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node.js API metrics
  - job_name: 'cc-ops-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api-node:4000']
        labels:
          service: 'cc-ops-api'
          environment: 'development'

  # Next.js Web (if exposing metrics)
  - job_name: 'cc-ops-web'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['web:3000']
        labels:
          service: 'cc-ops-web'
          environment: 'development'

  # Node Exporter for host metrics (optional)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          service: 'node-exporter'
    # Comment out if node-exporter not running

  # cAdvisor for container metrics (optional)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'cadvisor'
    # Comment out if cAdvisor not running